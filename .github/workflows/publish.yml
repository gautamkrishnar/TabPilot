name: Publish Container Image

# Runs automatically after CI succeeds on the default branch.
# Also triggered by semver tags (v1.2.3) for release publishes.
# Can be manually triggered with an optional tag override.
on:
  workflow_run:
    workflows: [CI]
    branches: [main, master]
    types: [completed]

  push:
    tags:
      - 'v*.*.*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Additional image tag (e.g. "v1.0.0"). SHA + latest are always added.'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest

    # For workflow_run triggers: only proceed when CI passed
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # ── Compute image tags & labels ─────────────────────────────────────────
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=master,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=Tab Pilot
            org.opencontainers.image.description=Real-time grooming and tab synchronization tool
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      # ── QEMU for arm64 emulation ────────────────────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # ── BuildKit with multi-platform support ────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Authenticate to GHCR ────────────────────────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build both architectures in parallel + push ─────────────────────────
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Sign the manifest list with Cosign (keyless / OIDC) ────────────────
      - name: Install Cosign
        if: steps.push.outputs.digest != ''
        uses: sigstore/cosign-installer@v4.1.1

      - name: Sign image
        if: steps.push.outputs.digest != ''
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

      # ── Job summary ──────────────────────────────────────────────────────────
      - name: Summary
        run: |
          {
            echo "## Container Image Published :ship:"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| **Registry** | \`${{ env.REGISTRY }}\` |"
            echo "| **Image** | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |"
            echo "| **Digest** | \`${{ steps.push.outputs.digest }}\` |"
            echo "| **Platforms** | \`linux/amd64\`, \`linux/arm64\` |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo ""
            echo "**Tags pushed:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo '```bash'
            echo "podman pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:master"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

  # ── Prune old SHA-tagged versions from GHCR ─────────────────────────────────
  prune:
    name: Prune old images from GHCR
    runs-on: ubuntu-latest
    needs: publish
    if: needs.publish.result == 'success'

    permissions:
      packages: write

    steps:
      - name: Delete old SHA-tagged versions
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner.toLowerCase();
            const packageName = context.repo.repo.toLowerCase();

            const { data: versions } = await github.rest.packages.getAllPackageVersionsForPackageOwnedByAuthenticatedUser({
              package_type: 'container',
              package_name: packageName,
              per_page: 100,
            });

            const SHA_KEEP = 1;
            const shaVersions = [];
            const toDelete = [];

            for (const v of versions) {
              const tags = v.metadata?.container?.tags ?? [];
              const hasSemver = tags.some(t => /^v?\d+(\.\d+)*$/.test(t));
              const hasLatest = tags.includes('latest') || tags.includes('master');
              const hasSha = tags.some(t => t.startsWith('sha-'));

              if (hasSemver || hasLatest) continue;
              if (hasSha) { shaVersions.push(v); continue; }
            }

            shaVersions.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            toDelete.push(...shaVersions.slice(SHA_KEEP));

            if (toDelete.length === 0) {
              console.log('Nothing to prune.');
              return;
            }

            for (const v of toDelete) {
              const tags = v.metadata?.container?.tags ?? [];
              console.log(`Deleting version ${v.id} (tags: ${tags.join(', ') || 'untagged'})`);
              await github.rest.packages.deletePackageVersionForAuthenticatedUser({
                package_type: 'container',
                package_name: packageName,
                package_version_id: v.id,
              });
            }
            console.log(`Pruned ${toDelete.length} version(s).`);
