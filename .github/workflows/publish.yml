name: Publish Container Image

on:
  workflow_run:
    workflows: [CI]
    branches: [main, master]
    types: [completed]

  push:
    tags:
      - 'v*.*.*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Additional image tag (e.g. "v1.0.0"). SHA + latest are always added.'
        required: false
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build & Push
    runs-on: ubuntu-latest

    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image metadata (without docs)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=master,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=Tab Pilot
            org.opencontainers.image.description=Real-time grooming and tab synchronization tool
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Image metadata (with docs)
        id: meta-docs
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short,suffix=-docs
            type=semver,pattern={{version}},suffix=-docs
            type=semver,pattern={{major}}.{{minor}},suffix=-docs
            type=semver,pattern={{major}},suffix=-docs
            type=raw,value=latest-docs,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=master-docs,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }}-docs,enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=Tab Pilot (with docs)
            org.opencontainers.image.description=Real-time grooming and tab synchronization tool — bundled with documentation
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build stages 1–7 (runner). Warms from the registry cache written by the
      # docs step on previous runs (it covers all layers). Writes to GHA cache
      # so the next step reuses layers without a registry pull.
      - name: Build and push (without docs)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-runner-docs
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-runner
            type=gha,scope=runner
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-runner,mode=max,image-manifest=true,oci-mediatypes=true
            type=gha,scope=runner,mode=max

      # Build stage 8 (runner-with-docs = FROM runner + one COPY). All prior
      # layers hit the GHA cache from the step above; only the COPY is new work.
      # Writes the full layer set back to the registry cache for future runs.
      - name: Build and push (with docs)
        id: push-docs
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          target: runner-with-docs
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-docs.outputs.tags }}
          labels: ${{ steps.meta-docs.outputs.labels }}
          cache-from: type=gha,scope=runner
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-runner-docs,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Install Cosign
        if: steps.push.outputs.digest != '' || steps.push-docs.outputs.digest != ''
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image (without docs)
        if: steps.push.outputs.digest != ''
        run: |
          IMAGE_REF=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "${IMAGE_REF}@${{ steps.push.outputs.digest }}"

      - name: Sign image (with docs)
        if: steps.push-docs.outputs.digest != ''
        run: |
          IMAGE_REF=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "${IMAGE_REF}@${{ steps.push-docs.outputs.digest }}"

      - name: Summary
        run: |
          {
            echo "## Container Images Published :ship:"
            echo ""
            echo "| | Without docs | With docs |"
            echo "| --- | --- | --- |"
            echo "| **Digest** | \`${{ steps.push.outputs.digest }}\` | \`${{ steps.push-docs.outputs.digest }}\` |"
            echo "| **Platforms** | \`linux/amd64\`, \`linux/arm64\` | \`linux/amd64\`, \`linux/arm64\` |"
            echo ""
            echo "**Tags (without docs):**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "**Tags (with docs):**"
            echo '```'
            echo "${{ steps.meta-docs.outputs.tags }}"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

  # ── Prune old SHA-tagged versions from GHCR ─────────────────────────────────
  prune:
    name: Prune old images from GHCR
    runs-on: ubuntu-latest
    needs: [publish]
    if: always() && needs.publish.result == 'success'

    permissions:
      packages: write

    steps:
      - name: Delete old SHA-tagged versions
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner.toLowerCase();
            const packageName = context.repo.repo.toLowerCase();

            const { data: versions } = await github.rest.packages.getAllPackageVersionsForPackageOwnedByAuthenticatedUser({
              package_type: 'container',
              package_name: packageName,
              per_page: 100,
            });

            const SHA_KEEP = 1;
            const shaVersions = [];
            const toDelete = [];

            for (const v of versions) {
              const tags = v.metadata?.container?.tags ?? [];
              const hasSemver = tags.some(t => /^v?\d+(\.\d+)*(-docs)?$/.test(t));
              const hasLatest = tags.some(t => ['latest', 'master', 'latest-docs', 'master-docs'].includes(t));
              const hasSha = tags.some(t => t.startsWith('sha-'));

              if (hasSemver || hasLatest) continue;
              if (hasSha) { shaVersions.push(v); continue; }
            }

            shaVersions.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            toDelete.push(...shaVersions.slice(SHA_KEEP));

            if (toDelete.length === 0) {
              console.log('Nothing to prune.');
              return;
            }

            for (const v of toDelete) {
              const tags = v.metadata?.container?.tags ?? [];
              console.log(`Deleting version ${v.id} (tags: ${tags.join(', ') || 'untagged'})`);
              await github.rest.packages.deletePackageVersionForAuthenticatedUser({
                package_type: 'container',
                package_name: packageName,
                package_version_id: v.id,
              });
            }
            console.log(`Pruned ${toDelete.length} version(s).`);
